name: test
on:
  workflow_dispatch:

permissions: {}

jobs:
  unshare-test:
    name: Unshare test
    runs-on: ubuntu-26.04
    steps:
      - name: Unshare test
        run: |
          ls /etc/apparmor.d/
          sudo apparmor_parser -R /etc/apparmor.d/unprivileged_userns
          unshare --user --map-current-user --map-subids --keep-caps --mount --propagation=shared -- echo 'It works!'

      - name: Show logs
        if: always()
        run: |
          sudo journalctl -b0 | grep DENIED
