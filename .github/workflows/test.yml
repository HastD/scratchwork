name: test
on:
  workflow_dispatch:

permissions: {}

jobs:
  unshare-test:
    name: Unshare test
    runs-on: ubuntu-26.04
    steps:
      - name: Unshare test
        run: |
          sudo apt install apparmor-utils
          sudo aa-complain /usr/bin/unshare
          /usr/bin/unshare --user --map-current-user --map-subids --keep-caps --mount --propagation=shared -- echo 'It works!'

      - name: Show logs
        if: always()
        run: |
          sudo journalctl -b0 | grep DENIED
