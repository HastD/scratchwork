name: test
on:
  workflow_dispatch:

permissions: {}

jobs:
  unshare-test:
    name: Unshare test
    runs-on: ubuntu-26.04
    steps:
      - name: Unshare test
        run: |
          unshare --user --map-current-user --map-subids --keep-caps --mount --propagation=shared -- echo 'It works!'
          sudo journalctl -b0 | grep DENIED
