name: test
on:
  workflow_dispatch:

permissions: {}

jobs:
  test-artifact:
    name: Test job
    runs-on: ubuntu-26.04
    steps:
      - name: Make artifact
        run: |
          if [ "${GITHUB_RUN_ATTEMPT}" -le 1 ]; then
            exit 1
          fi
          echo 'test artifact contents' > foo.txt

      - name: Upload test artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          path: foo.txt
          archive: false

  provenance:
    needs: [test-artifact]
    permissions:
      id-token: write
      actions: read
      contents: read
    uses: slsa-framework/actions/.github/workflows/attest_actions.yml@v0.2.0
    with:
      build-from-source: false
      version: v0.1.1
      watch-jobs: test-artifact
