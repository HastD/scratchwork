name: test
on:
  workflow_dispatch:

permissions: {}

jobs:
  unshare-test:
    name: Unshare test
    runs-on: ubuntu-26.04
    steps:
      - name: Unshare test
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt install apparmor-utils
          sudo aa-teardown
          /usr/bin/unshare --user --map-current-user --map-subids --keep-caps --mount --propagation=shared \
            /usr/bin/unshare --user --map-current-user --map-subids --keep-caps --mount --propagation=shared \
            -- echo 'It works!'
