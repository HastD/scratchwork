name: chunkah
on:
  workflow_dispatch:

permissions: {}

concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  chunkah:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        extra_args:
          - ""
          - "--env SOURCE_DATE_EPOCH=1785556800"
          - "--env SOURCE_DATE_EPOCH=0"
    steps:
      - name: Free disk space
        uses: hastd/free-disk-space@v0.1.2
        with:
          skip-if-available: 64G

      - name: Run Chunkah
        run: |
          set -euxo pipefail
          image_ref="quay.io/fedora/fedora-bootc:44"
          podman pull "${image_ref}"
          temp_dir="$(mktemp -d)"
          config_file="${temp_dir}/chunkah-config.json"
          podman inspect "${image_ref}" > "${config_file}"
          oci_dir="${temp_dir}/oci-out"
          podman run --rm -v "${temp_dir}:${temp_dir}" ${{ matrix.extra_args }} \
            --mount="type=image,src=${image_ref},destination=/chunkah" \
            quay.io/coreos/chunkah:latest build --config "${config_file}" \
            --compressed --prune /sysroot/ --max-layers 128 \
            --label ostree.commit- --label ostree.final-diffid- \
            -t "localhost/fedora-bootc-chunked:latest" --output "oci:${oci_dir}"

          manifest_digest=$(jq -cr '.manifests[0].digest' "${oci_dir}/index.json")
          cp "${oci_dir}/blobs/sha256/${manifest_digest#sha256:}" "manifest.json"

      - name: Pretty-print manifest
        run: |
          jq . manifest.json
