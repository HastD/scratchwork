name: chunkah
on:
  workflow_dispatch:

permissions: {}

concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  chunkah:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        hash:
          - "0437e9d4c5383c79f1dbf7a848f8502f1c073bb461d62d1702073c3c81aaf980"
          - "454f21a041b89ffb0fac53d97bf7e5a71a8355d81544929972c1abd68058013f"
    steps:
      - name: Free disk space
        uses: hastd/free-disk-space@v0.1.2
        with:
          skip-if-available: 64G

      - uses: extractions/setup-just@v4

      - name: Build Chunkah image
        run: |
          git clone https://github.com/HastD/chunkah -b dir-mtimes
          cd chunkah
          just buildimg

      - name: Run Chunkah
        env:
          HASH: ${{ matrix.hash }}
        run: |
          set -euxo pipefail
          image_ref="ghcr.io/hastd/silverblue-main-hardened@sha256:${HASH}"
          podman pull "${image_ref}"
          temp_dir="$(mktemp -d)"
          config_file="${temp_dir}/chunkah-config.json"
          podman inspect "${image_ref}" > "${config_file}"
          oci_dir="${temp_dir}/oci-out"
          podman run --rm -v "${temp_dir}:${temp_dir}" \
            --mount="type=image,src=${image_ref},destination=/chunkah" \
            localhost/chunkah:latest build --config "${config_file}" \
            --compressed --prune /sysroot/ --max-layers 128 \
            --label ostree.commit- --label ostree.final-diffid- \
            -t "localhost/silverblue-main-hardened:latest" --output "oci:${oci_dir}"

          manifest_digest=$(jq -cr '.manifests[0].digest' "${oci_dir}/index.json")
          cp "${oci_dir}/blobs/sha256/${manifest_digest#sha256:}" "manifest-${HASH}.json"

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          path: ./manifest-${{ matrix.hash }}.json
          if-no-files-found: error
          archive: false

      - name: Pretty-print manifest
        env:
          HASH: ${{ matrix.hash }}
        run: |
          jq . "manifest-${HASH}.json"
